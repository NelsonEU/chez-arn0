services:
  db:
    image: postgres:16
    command: -p ${DB_PORT}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -p ${DB_PORT}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    # Loopback only, reached via the Cloudflare Tunnel, not public.
    ports:
      - "127.0.0.1:${WEB_PORT}:${PORT}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
      DEBUG: ${DEBUG}
      PORT: ${PORT}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - media:/app/media
    restart: unless-stopped

volumes:
  pgdata:
  media:
