<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Chez Arnaud</title>
<script>
  // GitHub Pages serves this file for any unknown path (e.g. a direct link or
  // refresh on /recipes/vol-au-vent). It re-encodes the path into a query string
  // and redirects to the real app, which decodes it back (see index.html).
  // Standard GitHub Pages SPA workaround: https://github.com/rafgraph/spa-github-pages
  var pathSegmentsToKeep = 0;
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
